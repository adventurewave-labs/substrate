[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substrate"
version = "0.1.0"
description = "Substrate — the living knowledge graph for go-to-market (core services)"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "simple-salesforce>=1.12",
  "hubspot-api-client>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
substrate = "substrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["simple_salesforce.*", "hubspot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
